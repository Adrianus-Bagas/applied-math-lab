[package]
name = "lab-numerics-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Nama simbol modul: Python mencari PyInit__core di dalam .so.
name = "_core"
crate-type = ["cdylib"]
# Tidak ada test Rust di sini: semua matematika diuji di lab-numerics,
# perbatasan diuji lewat pytest. Ini juga mencegah test harness
# mencoba memuat libpython saat runtime.
test = false
doctest = false

[dependencies]
lab-numerics = { path = "../lab-numerics" }
numpy = { workspace = true }
pyo3 = { workspace = true }

[lints]
workspace = true
