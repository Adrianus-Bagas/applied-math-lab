[workspace]
resolver = "3"
members = ["packages/rust/*"]
# services/*/core ditambahkan saat crate pertama dibuat (MO-4.1)

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
# Versi dependensi bersama dicatat di sini saat mulai dipakai
# (rand_chacha, serde, rayon, ...).
# abi3-py313: satu wheel untuk CPython >= 3.13 (stable ABI).
# Tanpa fitur `extension-module` (deprecated; maturin >= 1.9.4 mengurusnya).
pyo3 = { version = "0.30", features = ["abi3-py313"] }
# Harus satu minor dengan pyo3.
numpy = "0.30"
# Harus SAMA PERSIS dengan versi wasm-bindgen-cli (wasm_bindgen_version di justfile).
wasm-bindgen = "=0.2.130"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Profil khusus build WASM: file diunduh browser, jadi ukuran kecil diutamakan.
# Profil `release` biasa tidak diubah karena dipakai wheel Python (maturin).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
