[project]
name = "applied-math-lab"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/python/*",
  "packages/rust/lab-numerics-py",
  "services/hello/worker",
]
# services/*/worker ditambahkan saat worker pertama dibuat

# ---------- ruff ----------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "W",   # pycodestyle
  "F",   # pyflakes: nama tak terpakai, undefined
  "I",   # urutan import
  "B",   # bugbear: pola rawan bug
  "UP",  # sintaks Python modern
  "N",   # penamaan
  "SIM", # penyederhanaan
  "NPY", # aturan khusus NumPy
  "PT",  # gaya pytest
  "RUF", # aturan khusus ruff
]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages/python", "packages/rust", "services"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

[dependency-groups]
dev = [
  "hypothesis>=6.170.14",
  "maturin>=1.9.4",
  "mypy>=2.4.1",
  "numpy>=2.5.4",
  "pytest>=9.2.0",
  "ruff>=0.17.3",
  "scipy>=1.18.1",
  "scipy-stubs>=1.18.1.1",
  "testcontainers[postgres]>=4.15.0",
  "types-jsonschema>=4.26.0.20261006",
]
