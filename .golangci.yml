version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # body HTTP response wajib ditutup
    - errorlint # pakai errors.Is/As, bukan ==
    - gocritic # pola kode yang bisa diperbaiki
    - revive # gaya Go idiomatik (komentar ekspor, penamaan)
    - unconvert # konversi tipe yang tidak perlu

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Adrianus-Bagas/applied-math-lab
