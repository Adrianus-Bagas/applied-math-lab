[project]
name = "mealops"
version = "0.1.0"
description = "MealOps: kontrak instans, generator, validator independen, dan benchmark"
requires-python = ">=3.13"
dependencies = ["numpy>=2.3", "pydantic>=2.13"]

# SESUAIKAN: salin blok [build-system] dari packages/python/lab-stats/pyproject.toml
# supaya semua paket Python di repo memakai build backend yang sama.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
