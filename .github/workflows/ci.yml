# CI lab: lint + test per bahasa, hanya untuk bahasa yang berubah, lalu build image.
# Setiap job check memanggil `just ci-<bahasa>`; gabungannya = `just check` (LAB-ADR-008).
# Image (LAB-ADR-012) dibangun setelah check lulus; push ke GHCR hanya dari main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # jalankan manual: semua bahasa dan semua image

# Hak minimal; job yang butuh lebih menambahkannya sendiri.
permissions:
  contents: read

# Run lama di branch/PR yang sama dibatalkan; di main setiap commit tetap diproses.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Samakan dengan versi di laptop (`just --version`, `uv --version`).
  JUST_VERSION: "1.59.0"
  UV_VERSION: "0.13.6"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: deteksi perubahan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter membaca daftar file PR lewat API
    outputs:
      langs: ${{ steps.lists.outputs.langs }}
      images: ${{ steps.lists.outputs.images }}
      unchanged: ${{ steps.lists.outputs.unchanged }}
      deploy: ${{ steps.lists.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Filter bahasa: nama filter = akhiran resep `just ci-<nama>`.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: langs
        with:
          filters: |
            go:
              - &shared [justfile, .github/workflows/ci.yml]
              - go.mod
              - go.sum
              - .golangci.yml
              - "**/*.go"
              - "packages/go/**"
              - "contracts/**"
            rust:
              - *shared
              - &rustpaths
                - Cargo.toml
                - Cargo.lock
                - rust-toolchain.toml
                - ".cargo/**"
                - "packages/rust/**"
                - "services/*/core/**"
                - "services/*/core-py/**"
            python:
              - *shared
              - *rustpaths
              - pyproject.toml
              - uv.lock
              - .python-version
              - "packages/python/**"
              - "services/*/worker/**"
              - "contracts/jobs/**"
            web:
              - *shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
              - .prettierignore
              - "apps/web/**"
              - "**/*.md"
              - "**/*.json"
              - "**/*.{yml,yaml}"

      # Filter image: nama filter = nama image di GHCR. Isinya = semua yang disalin Dockerfile-nya.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: images
        with:
          filters: |
            hello-api:
              - &dockershared [.dockerignore, .github/workflows/ci.yml]
              - go.mod
              - go.sum
              - "packages/go/**"
              - "contracts/**"
              - "services/hello/api/**"
            hello-worker:
              - *dockershared
              - pyproject.toml
              - uv.lock
              - .python-version
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - ".cargo/**"
              - "packages/python/**"
              - "packages/rust/**"
              - "contracts/jobs/**"
              - "services/hello/worker/**"
            web:
              - *dockershared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
              - "apps/web/**"

      # Filter VPS: file yang diunduh lab-deploy dari commit yang di-deploy.
      # lab-deploy.sh sendiri TIDAK di sini: skrip itu dipasang manual oleh admin (milik root),
      # sehingga CI tidak bisa mengubah aturan yang membatasi dirinya sendiri.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: vps
        with:
          filters: |
            vps:
              - .github/workflows/ci.yml
              - infrastructure/compose.vps.yaml
              - infrastructure/Caddyfile

      - name: susun daftar bahasa dan image
        id: lists
        env:
          EVENT: ${{ github.event_name }}
          LANGS: ${{ steps.langs.outputs.changes }}
          IMAGES: ${{ steps.images.outputs.changes }}
          VPS: ${{ steps.vps.outputs.vps }}
        run: |
          # Semua image lab; tambahkan di sini setiap ada image baru.
          ALL='["hello-api","hello-worker","web"]'
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            LANGS='["go","python","rust","web"]'
            IMAGES="$ALL"
          fi
          # Selisih himpunan: image yang tidak berubah → cukup di-tag ulang di main.
          UNCHANGED=$(jq -cn --argjson all "$ALL" --argjson ch "$IMAGES" '$all - $ch')
          # Deploy hanya bila ada yang benar-benar berubah di VPS (image atau konfigurasinya).
          if [[ "$IMAGES" != "[]" || "$VPS" == "true" ]]; then DEPLOY=true; else DEPLOY=false; fi
          {
            echo "langs=$LANGS"
            echo "images=$IMAGES"
            echo "unchanged=$UNCHANGED"
            echo "deploy=$DEPLOY"
          } >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.lang }})
    needs: changes
    # Matrix kosong adalah error di GitHub, jadi lewati job bila tak ada yang berubah.
    if: needs.changes.outputs.langs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false # satu bahasa gagal tidak membatalkan bahasa lain
      matrix:
        lang: ${{ fromJSON(needs.changes.outputs.langs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      # ---- Go ----
      - if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # cache modul Go aktif otomatis (kunci: go.sum)
      - if: matrix.lang == 'go'
        name: pasang golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      # ---- Rust (juga untuk Python: maturin mengompilasi extension PyO3) ----
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        name: pasang toolchain Rust dari rust-toolchain.toml
        run: rustup toolchain install
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.lang }}

      # ---- Python (juga untuk Rust: PYO3_PYTHON menunjuk ke .venv) ----
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        run: just setup-py

      # ---- Node ----
      - if: matrix.lang == 'web'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: matrix.lang == 'web'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: matrix.lang == 'web'
        run: just setup-node

      - name: just ci-${{ matrix.lang }}
        run: just ci-${{ matrix.lang }}

  images:
    name: image (${{ matrix.image }})
    needs: [changes, check]
    # always() agar job ini tetap dievaluasi saat check di-skip (hanya image yang berubah);
    # syarat berikutnya memastikan image TIDAK dibangun bila ada check yang gagal.
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # satu-satunya job yang boleh menulis ke GHCR
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Push hanya dari main; di PR image cukup dibangun sebagai bukti Dockerfile valid.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tentukan Dockerfile, nama image, dan versi
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            hello-api)    dockerfile=services/hello/api/Dockerfile ;;
            hello-worker) dockerfile=services/hello/worker/Dockerfile ;;
            web)          dockerfile=apps/web/Dockerfile ;;
            *) echo "image tidak dikenal: $IMAGE" >&2; exit 1 ;;
          esac
          {
            echo "DOCKERFILE=$dockerfile"
            # GHCR mewajibkan huruf kecil; ${VAR,,} = versi huruf kecil dari VAR.
            echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE"
            echo "VERSION=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag + label OCI (termasuk org.opencontainers.image.source yang menautkan package ke repo).
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # konteks = root repo hasil checkout (LAB-ADR-012, .dockerignore berlaku)
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          # Di PR image tidak di-push, jadi dimuat ke Docker lokal runner untuk smoke test.
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Membuktikan build-arg VERSION benar-benar sampai ke binary (bukan "dev").
      - name: smoke test versi
        if: matrix.image == 'hello-api'
        run: |
          got=$(docker run --rm "$IMAGE_REF:$VERSION" version)
          echo "hello-api version: $got"
          if [[ "$got" != *"\"version\":\"$VERSION\""* ]]; then
            echo "versi di binary tidak sama dengan $VERSION" >&2
            exit 1
          fi
  # Di main, image yang TIDAK berubah diberi tag sha-<7> yang menunjuk ke image `main` yang sama,
  # sehingga setiap commit main punya tiga tag lengkap untuk IMAGE_TAG di VPS (L0.8).
  retag:
    name: tag ulang image yang tidak berubah
    needs: [changes, check, images]
    if: >-
      always()
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.changes.outputs.unchanged != '[]'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: main → sha-<7> (tanpa build, hanya manifest di registry)
        env:
          UNCHANGED: ${{ needs.changes.outputs.unchanged }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          for image in $(jq -r '.[]' <<<"$UNCHANGED"); do
            echo "::group::$image"
            docker buildx imagetools create --tag "$repo/$image:$tag" "$repo/$image:main"
            echo "::endgroup::"
          done

  # Deploy ke VPS lewat user `deploy` yang dikunci forced command lab-deploy (L0.8).
  # Sengaja tidak masuk ci-ok: ci-ok menggerbangi PR, sedangkan deploy hanya terjadi setelah merge.
  deploy:
    name: deploy (VPS)
    needs: [changes, check, images, retag]
    if: >-
      always()
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.deploy == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secret hanya bisa dibaca job yang memakai environment ini, dan environment dibatasi ke main.
    environment:
      name: production
      url: https://applied-math-lab.portfolio-bagas.tech
    # Deploy berurutan, tidak pernah dibatalkan di tengah jalan.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {} # tidak butuh token GitHub sama sekali
    steps:
      - name: siapkan kunci SSH dan host key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Klien hanya mengirim SHA; lab-deploy memvalidasi dan mengerjakan sisanya di VPS.
      - name: deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          "deploy@${VPS_HOST}" "deploy ${GITHUB_SHA}"

      # Verifikasi dari sisi pengunjung: DNS, TLS, Caddy, dan Next.js.
      - name: smoke test publik
        env:
          URL: https://applied-math-lab.portfolio-bagas.tech
        run: |
          for path in / /hello; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$URL$path"
            echo "OK $URL$path"
          done

  # Satu-satunya check yang dijadikan "required" di branch protection.
  ci-ok:
    name: ci-ok
    if: always() # tetap jalan walau job sebelumnya gagal atau dilewati
    needs: [changes, check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: periksa hasil
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "hasil job: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            exit 1
          fi
