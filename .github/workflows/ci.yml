# CI lab: lint + test per bahasa, hanya untuk bahasa yang berubah.
# Setiap job memanggil resep `just ci-<bahasa>`; gabungannya = `just check` (LAB-ADR-008).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # jalankan manual: selalu memeriksa keempat bahasa

# Hak minimal; job yang butuh lebih menambahkannya sendiri.
permissions:
  contents: read

# Run lama di branch/PR yang sama dibatalkan; di main setiap commit tetap diperiksa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Samakan dengan versi di laptop (`just --version`, `uv --version`).
  JUST_VERSION: "GANTI"
  UV_VERSION: "GANTI"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: deteksi perubahan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter membaca daftar file PR lewat API
    outputs:
      langs: ${{ steps.langs.outputs.langs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Nama filter = nama bahasa = akhiran resep `just ci-<nama>`.
          filters: |
            go:
              - &shared [justfile, .github/workflows/ci.yml]
              - go.mod
              - go.sum
              - .golangci.yml
              - "**/*.go"
              - "packages/go/**"
              - "contracts/**"
            rust:
              - *shared
              - &rustpaths
                - Cargo.toml
                - Cargo.lock
                - rust-toolchain.toml
                - ".cargo/**"
                - "packages/rust/**"
                - "services/*/core/**"
                - "services/*/core-py/**"
            python:
              - *shared
              - *rustpaths
              - pyproject.toml
              - uv.lock
              - .python-version
              - "packages/python/**"
              - "services/*/worker/**"
              - "contracts/jobs/**"
            web:
              - *shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
              - .prettierignore
              - "apps/web/**"
              - "**/*.md"
              - "**/*.json"
              - "**/*.{yml,yaml}"
      - name: susun daftar bahasa
        id: langs
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo 'langs=["go","python","rust","web"]' >> "$GITHUB_OUTPUT"
          else
            echo "langs=$CHANGES" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (${{ matrix.lang }})
    needs: changes
    # Matrix kosong adalah error di GitHub, jadi lewati job bila tak ada yang berubah.
    if: needs.changes.outputs.langs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false # satu bahasa gagal tidak membatalkan bahasa lain
      matrix:
        lang: ${{ fromJSON(needs.changes.outputs.langs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: extractions/setup-just@v3
        with:
          just-version: ${{ env.JUST_VERSION }}

      # ---- Go ----
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # cache modul Go aktif otomatis (kunci: go.sum)
      - if: matrix.lang == 'go'
        name: pasang golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      # ---- Rust (juga untuk Python: maturin mengompilasi extension PyO3) ----
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        name: pasang toolchain Rust dari rust-toolchain.toml
        run: rustup toolchain install
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.lang }}

      # ---- Python (juga untuk Rust: PYO3_PYTHON menunjuk ke .venv) ----
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: matrix.lang == 'rust' || matrix.lang == 'python'
        run: just setup-py

      # ---- Node ----
      - if: matrix.lang == 'web'
        uses: pnpm/action-setup@v4 # versi pnpm dibaca dari "packageManager"
      - if: matrix.lang == 'web'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: matrix.lang == 'web'
        run: just setup-node

      - name: just ci-${{ matrix.lang }}
        run: just ci-${{ matrix.lang }}

  # Satu-satunya check yang dijadikan "required" di branch protection.
  ci-ok:
    name: ci-ok
    if: always() # tetap jalan walau job sebelumnya gagal atau dilewati
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: periksa hasil
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "hasil job: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            exit 1
          fi
